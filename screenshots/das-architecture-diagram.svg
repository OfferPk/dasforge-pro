<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#0d1522"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f30"/>
      <stop offset="100%" stop-color="#1a2a42"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#ffffff">DASForge Pro — System Architecture</text>
  <text x="40" y="70" font-family="JetBrains Mono, monospace" font-size="12" fill="#00e5ff">CCSDS 871.0-M-1 SOIS DEVICE ACCESS SERVICE (DAS) ARCHITECTURE</text>

  <!-- Flight Software Layer (Top) -->
  <rect x="40" y="100" width="920" height="90" rx="8" fill="url(#cardGrad)" stroke="#243552" stroke-width="1.5" />
  <rect x="40" y="100" width="920" height="30" rx="8" fill="#0f192b" />
  <text x="55" y="121" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. Spacecraft Flight Software Application Entities (NASA cFS / Core Flight Executive)</text>
  
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="200" height="40" rx="4" fill="#0a101b" stroke="#2979ff" />
    <text x="100" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">ADCS Guidance & Control</text>

    <rect x="230" y="0" width="200" height="40" rx="4" fill="#0a101b" stroke="#00e5ff" />
    <text x="330" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Power & Battery Mgmt (EPS)</text>

    <rect x="460" y="0" width="200" height="40" rx="4" fill="#0a101b" stroke="#00e676" />
    <text x="560" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Thermal Control & Heaters</text>

    <rect x="690" y="0" width="190" height="40" rx="4" fill="#0a101b" stroke="#ffab00" />
    <text x="785" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Payload Instrument Ops</text>
  </g>

  <!-- Service Primitives Callout (Arrows) -->
  <g transform="translate(450, 195)">
    <path d="M 0 0 L 0 25" stroke="#00e5ff" stroke-width="2" />
    <polygon points="-4,25 0,33 4,25" fill="#00e5ff" />
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e5ff">ACQUIRE / COMMAND Primitives (§3.4)</text>
  </g>

  <!-- SOIS DAS Service Layer (Middle) -->
  <rect x="40" y="235" width="920" height="150" rx="8" fill="url(#cardGrad)" stroke="#00e5ff" stroke-width="1.5" />
  <rect x="40" y="235" width="920" height="30" rx="8" fill="#0f192b" />
  <text x="55" y="256" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#00e5ff">2. SOIS Device Access Service (DAS) Provider Engine</text>

  <g transform="translate(60, 275)">
    <rect x="0" y="0" width="270" height="95" rx="6" fill="#090e17" stroke="#243552" />
    <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2979ff">Device Identifier Mapping (§3.2)</text>
    <text x="15" y="45" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Abstract physical_device_id</text>
    <text x="15" y="63" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• STAR-TRACKER-A, RW-01, BMS</text>
    <text x="15" y="81" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">• Subnetwork Address Decoupling</text>

    <rect x="305" y="0" width="270" height="95" rx="6" fill="#090e17" stroke="#243552" />
    <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e5ff">Transaction Manager (§3.3)</text>
    <text x="15" y="45" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Monotonic Transaction IDs</text>
    <text x="15" y="63" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Request / Indication Coupling</text>
    <text x="15" y="81" font-family="JetBrains Mono, monospace" font-size="10" fill="#ffab00">• Timeout & Error Intercepts</text>

    <rect x="610" y="0" width="270" height="95" rx="6" fill="#090e17" stroke="#243552" />
    <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e676">Device Access Protocol (DAP)</text>
    <text x="15" y="45" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• SpaceWire RMAP Packaging</text>
    <text x="15" y="63" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• MIL-STD-1553B Command Words</text>
    <text x="15" y="81" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• CANopen SDO Frame Synthesizer</text>
  </g>

  <!-- Subnetwork Downlink Arrow -->
  <g transform="translate(450, 390)">
    <path d="M 0 0 L 0 25" stroke="#00e676" stroke-width="2" />
    <polygon points="-4,25 0,33 4,25" fill="#00e676" />
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">Subnetwork Protocol Wireframes (§2.4)</text>
  </g>

  <!-- Physical Subnetwork & Hardware Layer (Bottom) -->
  <rect x="40" y="430" width="920" height="135" rx="8" fill="url(#cardGrad)" stroke="#243552" stroke-width="1.5" />
  <rect x="40" y="430" width="920" height="30" rx="8" fill="#0f192b" />
  <text x="55" y="451" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. Spacecraft Physical Onboard Subnetworks & Avionics Hardware</text>

  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="270" height="80" rx="6" fill="#090e17" stroke="#2979ff" />
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#2979ff">SpaceWire Subnetwork (ECSS-E-50-12C)</text>
    <text x="15" y="42" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">• Protocol: RMAP (ECSS-E-ST-50-52C)</text>
    <text x="15" y="58" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">• Target: Autonomous Star Tracker (0x32)</text>
    <text x="15" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#00e676">• Header & Data 8-bit CRC Verified</text>

    <rect x="305" y="0" width="270" height="80" rx="6" fill="#090e17" stroke="#ffab00" />
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffab00">MIL-STD-1553B Dual Redundant Bus</text>
    <text x="15" y="42" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">• Protocol: Command / Response T/R</text>
    <text x="15" y="58" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">• Target: Reaction Wheels (RT 4 / SA 1)</text>
    <text x="15" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#00e676">• Command Word Synthesis & Verification</text>

    <rect x="610" y="0" width="270" height="80" rx="6" fill="#090e17" stroke="#00e676" />
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e676">CANopen Space Subnetwork</text>
    <text x="15" y="42" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">• Protocol: SDO Upload / Download</text>
    <text x="15" y="58" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">• Target: Li-Ion Battery BMS (Node 7)</text>
    <text x="15" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#00e676">• 11-bit COB-ID (0x607) & Object Dict</text>
  </g>
</svg>
